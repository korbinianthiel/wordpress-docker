# Loopback forwarder: WordPress (php-fpm) reaches its own https URL through
# this TCP passthrough to the reverse proxy. php-fpm resolves SITE_HOST to this
# container (alias on wp-network, see docker-compose.yml). TLS is terminated by
# the reverse proxy, so its certificate stays valid.
server {
	listen 443;

	# Resolve the reverse proxy lazily via Docker's DNS, so nginx starts even
	# when the proxy is down. "caddy" is its service name on proxy-network.
	resolver 127.0.0.11 valid=30s ipv6=off;
	set $reverse_proxy caddy:443;
	proxy_pass $reverse_proxy;

	proxy_connect_timeout 5s;
}
