services:

  mysql:
    image: mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MARIADB_AUTO_UPGRADE=1
    restart: always
    volumes:
      - mysql-vol-1:/var/lib/mysql
    networks:
      wp-network:

  nginx-wp:
    image: wordpress-docker/nginx-wp
    build: data/docker/nginx
    restart: always
    volumes:
      - ./data/srv:/var/www
      - ./data/conf/nginx:/etc/nginx
    depends_on:
      - mysql
      - php-fpm-wp
      - redis
    networks:
      wp-network:
        aliases:
          - nginx
      proxy-network:
        aliases:
          - nginx-${NGINX_PROXY_ALIASE}

  php-fpm-wp:
    image: wordpress-docker/php-fpm-wp
    build: data/docker/php-fpm
    restart: always
    volumes:
      - ./data/srv:/var/www
      - ./data/conf/php-fpm/php-ini-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini
    # Resolve the site's own domain to the Docker host, so loopback requests
    # (wp-cron, REST API, Site Health) reach the reverse proxy directly instead
    # of going out to the public IP, which fails without hairpin NAT.
    extra_hosts:
      - "${SITE_HOST:?Set SITE_HOST in wordpress-docker.conf}:host-gateway"
    networks:
      wp-network:
        aliases:
          - php-fpm

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis-vol-1:/data
    networks:
      wp-network:

networks:
  wp-network:
  proxy-network:
    external: true

volumes:
  mysql-vol-1:
  redis-vol-1: