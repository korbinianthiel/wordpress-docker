services:

  mysql:
    # Pinned to a release series: only patch updates on pull. Never pin to an
    # older series than the data was created with (MariaDB can't downgrade).
    image: mariadb:13.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MARIADB_AUTO_UPGRADE=1
    restart: always
    volumes:
      - mysql-vol-1:/var/lib/mysql
    networks:
      wp-network:

  nginx-wp:
    image: wordpress-docker/nginx-wp
    build: data/docker/nginx
    restart: always
    volumes:
      - ./data/srv:/var/www
      - ./data/conf/nginx:/etc/nginx
    depends_on:
      - mysql
      - php-fpm-wp
      - redis
    networks:
      wp-network:
        aliases:
          - nginx
          # Loopback requests (wp-cron, REST API, Site Health) to the site's own
          # domain go to nginx, which forwards them to the reverse proxy
          # (see data/conf/nginx/stream/loopback.conf).
          - ${SITE_HOST:?SITE_HOST is not set}
      proxy-network:
        aliases:
          - nginx-${NGINX_PROXY_ALIASE}

  php-fpm-wp:
    image: wordpress-docker/php-fpm-wp
    build: data/docker/php-fpm
    restart: always
    volumes:
      - ./data/srv:/var/www
      - ./data/conf/php-fpm/php-ini-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini
    networks:
      wp-network:
        aliases:
          - php-fpm

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis-vol-1:/data
    networks:
      wp-network:

networks:
  wp-network:
  proxy-network:
    external: true

volumes:
  mysql-vol-1:
  redis-vol-1: